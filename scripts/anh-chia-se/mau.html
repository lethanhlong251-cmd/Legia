<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Dựng ảnh chia sẻ Thạch Lan</title>
<style>

               src:url("/fonts/cormorant-garamond-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family:"Cormorant Garamond"; font-weight:600; font-style:normal; font-display:block;
               src:url("/fonts/cormorant-garamond-vietnamese-600-normal.woff2") format("woff2"); unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB; }
  @font-face { font-family:"Cormorant Garamond"; font-weight:600; font-style:normal; font-display:block;
               src:url("/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family:"Cormorant Garamond"; font-weight:500; font-style:italic; font-display:block;
               src:url("/fonts/cormorant-garamond-vietnamese-500-italic.woff2") format("woff2"); unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB; }
  @font-face { font-family:"Cormorant Garamond"; font-weight:500; font-style:italic; font-display:block;
               src:url("/fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2"); }
  @font-face { font-family:"Be Vietnam Pro"; font-weight:400; font-style:normal; font-display:block;

  @font-face { font-family:"Be Vietnam Pro"; font-weight:400; font-style:normal; font-display:block;
               src:url("/fonts/be-vietnam-pro-latin-400-normal.woff2") format("woff2"); }

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#333; }

  /* Khung đúng bằng kích thước ảnh chia sẻ chuẩn của Facebook, Zalo, Messenger */
  .khung {
    width:1200px; height:630px;
    display:grid; grid-template-columns:640px 560px;
    overflow:hidden; background:#FAF6EF;
    font-family:"Be Vietnam Pro", system-ui, sans-serif; color:#2B211C;
  }
  .anh img { width:100%; height:100%; object-fit:cover; display:block; }

  .bang {
    position:relative; display:flex; flex-direction:column; justify-content:center;
    padding:0 64px 0 60px;
  }
  /* Dải đỏ son mảnh ở mép trái bảng chữ */
  .bang::before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:#9E2B25; }

  .dau { display:flex; align-items:center; gap:18px; }
  .bieu-tuong { width:58px; height:58px; display:block; flex:none; }
  .ten { font-family:"Cormorant Garamond", serif; font-weight:600; font-size:42px; line-height:1;
          letter-spacing:.18em; color:#2B211C; white-space:nowrap; }
  .slogan { margin-top:22px; font-size:13px; letter-spacing:.3em; color:#8A6630; }

  .gach { margin:34px 0 30px; height:1px; width:72px; background:rgba(43,33,28,.28); }

  .tieu-de { font-family:"Cormorant Garamond", serif; font-weight:500; font-size:46px; line-height:1.08; }
  .tieu-de em { font-style:italic; color:#9E2B25; }

  .cam-ket { margin-top:30px; display:flex; flex-direction:column; gap:10px; }
  .y { display:flex; align-items:center; gap:12px; font-size:17px; color:#5A4C43; }
  .vach { width:14px; height:1px; background:#9E2B25; flex:none; }

  .web { position:absolute; left:60px; bottom:40px; font-size:14px; letter-spacing:.16em; color:#7A6A5F; }
</style>
</head>
<body>
<div class="khung">
  <div class="anh">
    <img src="/images/thuong-hieu/banh-viet-nam-ngang.jpg" alt="">
  </div>

  <div class="bang">
    <div class="dau">
      <!-- Biểu tượng mặt khuôn 8 cánh lồng hoa sen -->
      <svg class="bieu-tuong" viewBox="-50 -50 100 100" fill="none">
        <path d="M 16.84 -40.65 A 19 19 0 0 1 40.65 -16.84 A 19 19 0 0 1 40.65 16.84 A 19 19 0 0 1 16.84 40.65 A 19 19 0 0 1 -16.84 40.65 A 19 19 0 0 1 -40.65 16.84 A 19 19 0 0 1 -40.65 -16.84 A 19 19 0 0 1 -16.84 -40.65 A 19 19 0 0 1 16.84 -40.65 Z" stroke="#9E2B25" stroke-width="3.2" stroke-linejoin="round"/>
        <g fill="#C8A24A">
          <circle cx="0" cy="-37" r="1.7"/><circle cx="18.5" cy="-32.04" r="1.7"/><circle cx="32.04" cy="-18.5" r="1.7"/><circle cx="37" cy="0" r="1.7"/><circle cx="32.04" cy="18.5" r="1.7"/><circle cx="18.5" cy="32.04" r="1.7"/><circle cx="0" cy="37" r="1.7"/><circle cx="-18.5" cy="32.04" r="1.7"/><circle cx="-32.04" cy="18.5" r="1.7"/><circle cx="-37" cy="0" r="1.7"/><circle cx="-32.04" cy="-18.5" r="1.7"/><circle cx="-18.5" cy="-32.04" r="1.7"/>
        </g>
        <path d="M 11.48 -27.72 A 13 13 0 0 1 27.72 -11.48 A 13 13 0 0 1 27.72 11.48 A 13 13 0 0 1 11.48 27.72 A 13 13 0 0 1 -11.48 27.72 A 13 13 0 0 1 -27.72 11.48 A 13 13 0 0 1 -27.72 -11.48 A 13 13 0 0 1 -11.48 -27.72 A 13 13 0 0 1 11.48 -27.72 Z" stroke="#9E2B25" stroke-width="2" stroke-linejoin="round"/>
        <g fill="#C8A24A">
          <path d="M 0 0 C -7 -6, -6.5 -14, 0 -19 C 6.5 -14, 7 -6, 0 0 Z"/>
          <path d="M 0 0 C -7 -6, -6.5 -14, 0 -19 C 6.5 -14, 7 -6, 0 0 Z" transform="rotate(60)" fill-opacity=".6"/>
          <path d="M 0 0 C -7 -6, -6.5 -14, 0 -19 C 6.5 -14, 7 -6, 0 0 Z" transform="rotate(120)"/>
          <path d="M 0 0 C -7 -6, -6.5 -14, 0 -19 C 6.5 -14, 7 -6, 0 0 Z" transform="rotate(180)" fill-opacity=".6"/>
          <path d="M 0 0 C -7 -6, -6.5 -14, 0 -19 C 6.5 -14, 7 -6, 0 0 Z" transform="rotate(240)"/>
          <path d="M 0 0 C -7 -6, -6.5 -14, 0 -19 C 6.5 -14, 7 -6, 0 0 Z" transform="rotate(300)" fill-opacity=".6"/>
        </g>
        <circle cx="0" cy="0" r="4.2" fill="#9E2B25"/>
        <circle cx="0" cy="0" r="1.8" fill="#C8A24A"/>
      </svg>
      <div class="ten">THẠCH LAN</div>
    </div>
    <div class="slogan">KHUÔN BÁNH HOA VĂN VIỆT</div>

    <div class="gach"></div>

    <div class="tieu-de">Hoa văn Việt,<br><em>khắc trọn</em> từng<br>chiếc bánh</div>

    <div class="cam-ket">
      <div class="y"><span class="vach"></span>Miễn phí vận chuyển toàn quốc</div>
      <div class="y"><span class="vach"></span>Nhận hàng, kiểm tra rồi mới trả tiền</div>
    </div>

    <div class="web">THACHLAN.COM</div>
  </div>
</div>
</body>
</html>
